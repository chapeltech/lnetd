name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  debian:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-slim
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            build-essential ca-certificates debhelper git groff-base \
            python3 util-linux
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.event.release.tag_name }}
      - name: Stage tagged source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(dpkg --print-architecture)" = "$TARGET_ARCHITECTURE"
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          mkdir -p build/source
          git archive --format=tar "refs/tags/$RELEASE_TAG" |
            tar -x -C build/source
          rm -rf build/source/debian
          cp -a debian build/source/
      - name: Build Debian package
        run: |
          package_version=$(dpkg-parsechangelog \
            --file build/source/debian/changelog -S Version)
          test "${RELEASE_TAG#v}" = "${package_version%%-*}"
          test "${package_version#*-}" = 2
          (cd build/source && dpkg-buildpackage --build=binary --no-sign)
          mkdir artifacts
          cp build/*.deb artifacts/
          for package in artifacts/*.deb; do
            test "$(dpkg-deb -f "$package" Architecture)" = \
              "$TARGET_ARCHITECTURE"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: debian-${{ matrix.architecture }}
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 1

  rpm:
    runs-on: ubuntu-24.04
    container: rockylinux:9
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Install build and signing dependencies
        run: >-
          dnf install -y
          gcc git gnupg2 gzip make groff-base python3
          rpm-build rpm-sign util-linux
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.event.release.tag_name }}
      - name: Build EL9 packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(uname -m)" = x86_64
          test "$(rpm --eval '%{_arch}')" = x86_64
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"

          topdir=$HOME/rpmbuild
          spec=packaging/rpm/lnetd.spec
          version=$(rpm -q --specfile "$spec" --qf '%{version}\n' | head -1)
          revision=$(rpm -q --specfile "$spec" --qf '%{release}\n' | head -1)
          test "${RELEASE_TAG#v}" = "$version"
          test "${revision%%.*}" = 2

          mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git archive --format=tar --prefix="lnetd-$version/" \
            "refs/tags/$RELEASE_TAG" |
            gzip -n >"$topdir/SOURCES/lnetd-$version.tar.gz"
          cp "$spec" "$topdir/SPECS/"
          rpmbuild -ba "$topdir/SPECS/lnetd.spec"

          mkdir artifacts
          find "$topdir/RPMS" "$topdir/SRPMS" -type f -name '*.rpm' \
            -exec cp {} artifacts/ \;
          for package in artifacts/*.rpm; do
            architecture=$(rpm -qp --qf '%{arch}\n' "$package")
            case "$architecture" in
              x86_64|noarch|src) ;;
              *) exit 1 ;;
            esac
          done
      - name: Sign and verify RPM packages
        env:
          ARCHIVE_SIGNING_FINGERPRINT: ${{ vars.ARCHIVE_SIGNING_FINGERPRINT }}
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
          ARCHIVE_SIGNING_PASSPHRASE: ${{ secrets.ARCHIVE_SIGNING_PASSPHRASE }}
          GNUPGHOME: ${{ runner.temp }}/archive-signing
        run: |
          test -n "$ARCHIVE_SIGNING_KEY"
          test -n "$ARCHIVE_SIGNING_PASSPHRASE"
          fingerprint=$(printf '%s' "$ARCHIVE_SIGNING_FINGERPRINT" |
            tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          case "$fingerprint" in
            ''|*[!0-9A-F]*) exit 1 ;;
          esac

          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$ARCHIVE_SIGNING_KEY" | gpg --batch --import
          gpg --batch --with-colons --list-secret-keys "$fingerprint" |
            awk -F: '$1 == "fpr" { print toupper($10) }' |
            grep -Fx "$fingerprint"

          passphrase_file=$GNUPGHOME/passphrase
          (
            umask 077
            printf '%s' "$ARCHIVE_SIGNING_PASSPHRASE" >"$passphrase_file"
          )
          rpmsign --addsign \
            --define "_gpg_name $fingerprint" \
            --define "_gpg_path $GNUPGHOME" \
            --define "__gpg_sign_cmd %{__gpg} --batch --no-verbose --no-armor --pinentry-mode loopback --passphrase-file $passphrase_file -u \"%{_gpg_name}\" -sbo %{__signature_filename} %{__plaintext_filename}" \
            artifacts/*.rpm

          gpg --batch --armor --export "$fingerprint" >archive-signing-key.asc
          rpm --import archive-signing-key.asc
          for package in artifacts/*.rpm; do
            rpm --checksig "$package" | grep -E 'digests signatures OK$'
            rpm -Kv "$package" |
              grep -E 'Header V[34] RSA/SHA(256|512) Signature.*: OK'
          done
      - name: Remove signing key material
        if: ${{ always() }}
        env:
          GNUPGHOME: ${{ runner.temp }}/archive-signing
        run: rm -rf "$GNUPGHOME" archive-signing-key.asc
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-el9-x86_64
          path: artifacts/*.rpm
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [debian, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload new release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/* \
            --clobber --repo "$GITHUB_REPOSITORY"
      - name: Dispatch package repository update
        env:
          GH_TOKEN: ${{ secrets.PKGS_DISPATCH_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            '{event_type: "package-release", client_payload: {repository: $repository, tag: $tag}}' |
            gh api --method POST repos/ChapelTech/pkgs/dispatches --input -
